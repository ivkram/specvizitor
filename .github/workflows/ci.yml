name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      # the ruff version from uv.lock
      - name: Run ruff
        run: uv run --locked --only-group dev ruff check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # the Qt6 wheels load OpenGL, keyboard and font libraries from the system, which the runner image lacks
      - name: Install the Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0t64 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --locked pytest

  # PyQt6 is the declared binding, but qtpy lets the app run on PySide6 as well
  test-pyside6:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # the Qt6 wheels load OpenGL, keyboard and font libraries from the system, which the runner image lacks
      - name: Install the Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0t64 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run tests
        run: uv run --locked --with PySide6 pytest
        env:
          QT_API: pyside6

  test-lowest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # the Qt6 wheels load OpenGL, keyboard and font libraries from the system, which the runner image lacks
      - name: Install the Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0t64 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"

      - name: Install the lowest supported versions of the dependencies
        run: uv sync --resolution lowest-direct

      - name: Run tests
        run: uv run --no-sync pytest
