name: "Sphinx: Render docs"

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v10
      with:
        python-version: "3.14"

    # only the docs tools from the dev group, not the package; warnings fail the build
    - name: Build HTML
      run: uv run --locked --only-group dev sphinx-build -W --keep-going -b html docs docs/_build/html

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: html-docs
        path: docs/_build/html/
