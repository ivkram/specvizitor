[project]
name = "specvizitor"
version = "0.8.0"
description = "Python GUI application for a visual inspection of astronomical spectroscopic data"
authors = [
    {name = "Ivan Kramarenko"},
    {name = "Josephine Kerutt"},
]
maintainers = [
    {name = "Ivan Kramarenko", email = "im.kramarenko@gmail.com"},
]
requires-python = ">=3.11"
readme = "README.md"
license = "BSD-3-Clause"
keywords = ["astronomy", "spectroscopy", "visualization", "GUI"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "astropy>=6.1.0",
    "dacite>=1.8.1",
    "darkdetect>=0.8.0",
    "pandas>=2.2.0",
    "pgcolorbar==1.1.3",
    "pillow>=10.2.0",
    "platformdirs>=4.2.0",
    "pyqt6>=6.5.0",
    "pyqtgraph>=0.14.0",
    "qtpy>=2.4.1",
    "rasterio>=1.3.9",
    "scipy>=1.12.0",
]

[project.urls]
Homepage = "https://specvizitor.ivkram.space"
Repository = "https://github.com/ivkram/specvizitor"

[project.scripts]
specvizitor = "specvizitor.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.9",
    "sphinx>=8.1.3",
    "sphinx-book-theme>=1.1.4",
    "sphinx-copybutton>=0.5.2",
]

[tool.uv]
default-groups = "all"

[tool.ruff]
extend-exclude = ["specvizitor/config/appearance"]
line-length = 120

[tool.ruff.lint]
ignore = [
    # the GUI catches any error from reading user files and third-party loaders, logs it and carries on
    "BLE001",
    # CamelCase module names (MainWindow.py, ...) are the project's convention
    "N999",
]

[tool.ruff.lint.isort]
# qtpy before any other third-party import: pyqtgraph picks up the Qt binding that is already loaded, so that
# both follow QT_API
sections = { qt = ["qtpy"] }
section-order = ["future", "standard-library", "qt", "third-party", "first-party", "local-folder"]

[tool.hatch.build.targets.wheel]
exclude = ["**/tests"]

[tool.hatch.build.targets.sdist]
include = ["specvizitor", "README.md", "LICENSE.txt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
